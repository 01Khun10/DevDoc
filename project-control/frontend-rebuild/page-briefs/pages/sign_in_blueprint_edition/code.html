<style>
        .bg-blueprint-grid {
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(51, 81, 126, 0.1) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(51, 81, 126, 0.1) 1px, transparent 1px);
        }
        .vignette {
            background: radial-gradient(circle at center, transparent 0%, #0B1526 100%);
        }
    </style>

<body class="bg-canvas min-h-screen flex items-center justify-center relative overflow-hidden font-body-md text-on-surface">
<!-- Ambient Background -->
<div class="absolute inset-0 bg-blueprint-grid"></div>
<div class="absolute inset-0 vignette pointer-events-none"></div>
<!-- Main Content Container -->
<main class="relative z-10 w-full max-w-[400px] px-margin-mobile md:px-0">
<!-- Sign In Card -->
<div class="bg-card border border-blueprint rounded-lg p-8 relative shadow-[0_4px_20px_rgba(59,130,246,0.05)]">
<!-- Header -->
<div class="text-center mb-8">
<div class="flex flex-col items-center gap-2 mb-4">
<span class="font-h2 text-h2 lowercase text-on-surface tracking-tight">devdoc</span>
<span class="font-label-sm text-label-sm text-outline px-2 py-1 border border-blueprint/50 rounded bg-input-dark/50">SIGN IN</span>
</div>
<h1 class="font-h1-mobile md:font-h1 text-h1-mobile md:text-h1 text-on-surface">Welcome back</h1>
</div>
<!-- Form -->
<form class="space-y-6">
<!-- Email Field (Error State Example available by adding classes below) -->
<!-- To test error: add 'border-error' to input, remove 'border-blueprint'. Show error message span. -->
<div class="space-y-2">
<label class="block font-label-sm text-label-sm text-on-surface-variant" for="email">Email Address</label>
<input class="w-full bg-input-dark border border-blueprint rounded-DEFAULT px-4 py-3 text-on-surface font-code-block text-code-block focus:outline-none focus:border-cyan-accent focus:ring-1 focus:ring-cyan-accent transition-colors" id="email" name="email" placeholder="name@company.com" type="email" value="architect@devdoc.local"/>
<!-- Error Message (Hidden by default) -->
<!-- <span class="font-label-sm text-label-sm text-error flex items-center gap-1 mt-1">
                        <span class="material-symbols-outlined text-[14px]">error</span> Invalid credentials
                    </span> -->
</div>
<!-- Password Field -->
<div class="space-y-2">
<label class="block font-label-sm text-label-sm text-on-surface-variant" for="password">Password</label>
<div class="relative">
<input class="w-full bg-input-dark border border-blueprint rounded-DEFAULT px-4 py-3 text-on-surface font-code-block text-code-block focus:outline-none focus:border-cyan-accent focus:ring-1 focus:ring-cyan-accent transition-colors pr-10" id="password" name="password" type="password" value="••••••••"/>
<button aria-label="Toggle password visibility" class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-cyan-accent transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Remember & Forgot -->
<div class="flex items-center justify-between">
<label class="flex items-center gap-2 cursor-pointer group">
<input class="w-4 h-4 rounded-sm border-blueprint bg-input-dark text-btn-primary focus:ring-cyan-accent focus:ring-offset-input-dark" type="checkbox"/>
<span class="font-body-md text-[14px] text-on-surface-variant group-hover:text-on-surface transition-colors">Remember me</span>
</label>
<a class="font-body-md text-[14px] text-btn-primary hover:text-cyan-accent transition-colors" href="#">Forgot password?</a>
</div>
<!-- Primary Action (Loading state example available) -->
<!-- To test loading: add 'opacity-80 cursor-not-allowed' to button, show spinner, hide text -->
<button class="w-full bg-btn-primary hover:bg-btn-primary/90 text-on-surface font-code-block text-code-block font-bold rounded-DEFAULT py-3 flex items-center justify-center gap-2 transition-all relative overflow-hidden group" type="submit">
<span class="relative z-10">Sign in</span>
<!-- Loading Spinner (Hidden by default) -->
<!-- <span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span> -->
<div class="absolute inset-0 bg-white/20 translate-y-[100%] group-hover:translate-y-0 transition-transform duration-300"></div>
</button>
<!-- Divider -->
<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-blueprint"></div>
<span class="flex-shrink-0 mx-4 font-label-sm text-label-sm text-outline">OR</span>
<div class="flex-grow border-t border-blueprint"></div>
</div>
<!-- Secondary Action -->
<button class="w-full bg-transparent border border-blueprint hover:border-cyan-accent/50 hover:bg-input-dark text-cyan-accent font-code-block text-code-block rounded-DEFAULT py-3 flex flex-col items-center justify-center transition-all" type="button">
<span>Try the demo project</span>
<span class="text-[10px] text-cyan-accent/70 mt-1">demo@devdoc.local</span>
</button>
</form>
<!-- Bottom Link -->
<div class="mt-8 text-center">
<a class="font-body-md text-[14px] text-on-surface-variant hover:text-btn-primary transition-colors" href="#">
                    New to DevDoc? <span class="text-btn-primary">Create an account</span>
</a>
</div>
<!-- Title Block Stamp -->
<div class="absolute bottom-2 right-4 font-label-sm text-[10px] text-blueprint opacity-50 tracking-widest">
                rev 3.0
            </div>
</div>
<!-- Microcopy Footer -->
<div class="mt-8 text-center">
<p class="font-label-sm text-label-sm text-outline opacity-60">
                Structured docs • Validation • Traceability • Export
            </p>
</div>
</main>
<script>
        // Simple password toggle logic for the demo
        document.querySelector('button[aria-label="Toggle password visibility"]').addEventListener('click', function() {
            const input = document.getElementById('password');
            const icon = this.querySelector('span');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
            }
        });
    </script>
</body></html>

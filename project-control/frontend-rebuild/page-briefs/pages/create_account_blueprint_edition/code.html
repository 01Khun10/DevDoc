<style>
        /* Blueprint Grid Background */
        .bg-blueprint-grid {
            background-size: 32px 32px;
            background-image: 
                linear-gradient(to right, rgba(51, 81, 126, 0.1) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(51, 81, 126, 0.1) 1px, transparent 1px);
        }
        
        /* Subtle Vignette */
        .vignette {
            background: radial-gradient(circle, transparent 50%, #0B1526 150%);
        }

        /* Custom Input Focus */
        .input-blueprint:focus {
            outline: none;
            border-color: #33517E;
            box-shadow: 0 1px 0 0 #22D3EE;
        }

        /* Password Strength Animation */
        .strength-bar {
            transition: width 0.3s ease, background-color 0.3s ease;
        }
    </style>
</head>
<body class="bg-blueprint-canvas text-on-surface min-h-screen flex items-center justify-center relative overflow-hidden bg-blueprint-grid">
<!-- Vignette Overlay -->
<div class="absolute inset-0 vignette pointer-events-none z-0"></div>
<!-- Main Container -->
<main class="relative z-10 w-full max-w-[400px] mx-auto px-margin-mobile md:px-0">
<!-- Registration Card -->
<div class="bg-blueprint-card border border-blueprint-line rounded-lg p-8 relative shadow-2xl">
<!-- Corner Block Stamp -->
<div class="absolute bottom-2 right-2 border border-blueprint-line px-2 py-1 bg-blueprint-canvas/50">
<span class="font-code-block text-[10px] text-on-surface-variant uppercase tracking-wider">REV 3.0</span>
</div>
<!-- Header Section -->
<div class="text-center mb-8">
<h1 class="font-h2 text-h2 lowercase tracking-tight mb-2">devdoc</h1>
<p class="font-code-block text-eyebrow text-blueprint-cyan mb-6">CREATE ACCOUNT</p>
<h2 class="font-h3 text-h3 text-on-surface">Start your first blueprint</h2>
</div>
<!-- Form -->
<form class="space-y-5" onsubmit="event.preventDefault();">
<!-- Full Name -->
<div>
<label class="block font-code-block text-label-sm text-on-surface-variant mb-1.5 uppercase" for="fullName">Full Name</label>
<input class="input-blueprint w-full bg-blueprint-canvas border-blueprint-line rounded text-on-surface font-body-md py-2.5 px-3 transition-shadow" id="fullName" placeholder="e.g. Ada Lovelace" required="" type="text"/>
</div>
<!-- Email -->
<div>
<label class="block font-code-block text-label-sm text-on-surface-variant mb-1.5 uppercase" for="email">Email Address</label>
<input class="input-blueprint w-full bg-blueprint-canvas border-blueprint-line rounded text-on-surface font-body-md py-2.5 px-3 transition-shadow" id="email" placeholder="ada@example.com" required="" type="email"/>
</div>
<!-- Password -->
<div>
<label class="block font-code-block text-label-sm text-on-surface-variant mb-1.5 uppercase" for="password">Password</label>
<div class="relative">
<input class="input-blueprint w-full bg-blueprint-canvas border-blueprint-line rounded text-on-surface font-body-md py-2.5 px-3 transition-shadow" id="password" onkeyup="checkStrength(this.value)" placeholder="••••••••" required="" type="password"/>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[18px] cursor-pointer hover:text-on-surface transition-colors">visibility_off</span>
</div>
<!-- Password Strength Indicator -->
<div class="mt-2 flex items-center justify-between gap-2 h-1">
<div class="h-full bg-blueprint-canvas rounded-full flex-grow overflow-hidden relative border border-blueprint-line/30">
<div class="strength-bar h-full w-0 bg-blueprint-blue absolute left-0 top-0" id="strengthIndicator"></div>
</div>
</div>
<div class="mt-1 flex justify-end">
<span class="font-code-block text-[10px] text-on-surface-variant lowercase" id="strengthText">weak</span>
</div>
</div>
<!-- Confirm Password -->
<div>
<label class="block font-code-block text-label-sm text-on-surface-variant mb-1.5 uppercase" for="confirmPassword">Confirm Password</label>
<input class="input-blueprint w-full bg-blueprint-canvas border-blueprint-line rounded text-on-surface font-body-md py-2.5 px-3 transition-shadow" id="confirmPassword" placeholder="••••••••" required="" type="password"/>
</div>
<!-- Actions -->
<div class="pt-4">
<button class="w-full bg-blueprint-blue hover:bg-blueprint-blue/90 text-[#ffffff] font-code-block font-bold text-[14px] py-3 rounded transition-colors uppercase tracking-wider shadow-[0_0_15px_rgba(59,130,246,0.3)]" type="submit">
                        Create account
                    </button>
</div>
</form>
<!-- Footer Links -->
<div class="mt-6 text-center space-y-4">
<p class="font-body-md text-[14px] text-on-surface-variant">
                    Already have an account? 
                    <a class="text-blueprint-cyan hover:text-blueprint-cyan/80 transition-colors font-medium border-b border-blueprint-cyan/30 hover:border-blueprint-cyan" href="#">Sign in</a>
</p>
<p class="font-body-md text-[12px] text-on-surface-variant/70">
                    By registering, you agree to our <a class="hover:text-on-surface underline decoration-blueprint-line underline-offset-2" href="#">Terms</a> and <a class="hover:text-on-surface underline decoration-blueprint-line underline-offset-2" href="#">Privacy Policy</a>.
                </p>
</div>
</div>
</main>
<script>
        // Simple password strength checker for micro-interaction
        function checkStrength(password) {
            const indicator = document.getElementById('strengthIndicator');
            const text = document.getElementById('strengthText');
            
            if (password.length === 0) {
                indicator.style.width = '0%';
                text.textContent = 'weak';
                text.style.color = '#c2c6d6';
            } else if (password.length < 6) {
                indicator.style.width = '33%';
                indicator.style.backgroundColor = '#3B82F6'; // Blue
                text.textContent = 'weak';
                text.style.color = '#c2c6d6';
            } else if (password.length >= 6 && !/[A-Z]/.test(password) || !/[0-9]/.test(password)) {
                indicator.style.width = '66%';
                indicator.style.backgroundColor = '#0ea5e9'; // Lighter blue
                text.textContent = 'fair';
                text.style.color = '#0ea5e9';
            } else {
                indicator.style.width = '100%';
                indicator.style.backgroundColor = '#22D3EE'; // Cyan
                text.textContent = 'strong';
                text.style.color = '#22D3EE';
            }
        }
    </script>
</body></html>
